apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: child-app-frontend
  namespace: argocd
  labels:
    tier: frontend
    parent: root-app-of-apps
    app.kubernetes.io/part-of: argo-showcase
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BGLuis/argo-showcase.git
    targetRevision: main
    path: argocd/sample-app/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: app-frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
